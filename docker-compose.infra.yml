services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aegis_root_secure_password_2026
    volumes:
      - aegisai_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegisai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aegisai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: aegisai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aegis_audit
    volumes:
      - aegisai_mongo_data:/data/db

volumes:
  aegisai_postgres_data:
  aegisai_redis_data:
  aegisai_mongo_data:

