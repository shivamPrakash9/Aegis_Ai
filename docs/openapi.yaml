openapi: 3.1.0
info:
  title: AegisAI Enterprise AI Security & Governance Platform API
  version: 1.0.0
  description: >
    Unified OpenAPI specification for the AegisAI Enterprise AI Security & Governance Gateway platform.
    AegisAI coordinates 6 microservices: Identity (:3000), AI Gateway (:3001), Privacy Scanner (:3002),
    Policy Approval (:3003), Model Provider (:3004), and Security Audit (:3005).
    Supports JSON and XML content negotiation, ETag caching with 304, cursor-based pagination,
    rate-limiting headers, JWT auth, GraphQL, and legacy SOAP interoperability.
servers:
  - url: http://localhost:3001
    description: AI Gateway (Primary Entrypoint)
  - url: http://localhost:3000
    description: Identity & Access Management Service
  - url: http://localhost:3002
    description: Privacy Scanner Service
  - url: http://localhost:3003
    description: Policy & Approval Governance Service
  - url: http://localhost:3004
    description: Model & Provider Routing Service
  - url: http://localhost:3005
    description: Security & Immutable Audit Service

paths:
  # =========================================================================
  # AI GATEWAY ENDPOINTS (Port 3001)
  # =========================================================================
  /v1/ai-requests:
    post:
      tags:
        - AI Requests
      summary: Submit AI Request
      description: >
        Submits an AI request for real-time security pipeline evaluation,
        privacy scanning, policy enforcement, and model routing.
      security:
        - BearerAuth: []
        - ServiceAccountAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique idempotency key to prevent duplicate provider execution.
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: Supported formats application/json, application/xml
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAiRequestPayload'
      responses:
        '202':
          description: Request accepted and processed through pipeline.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestSubmissionResponse'
            application/xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags:
        - AI Requests
      summary: List AI Requests
      description: Lists AI requests scoped to caller's organization using cursor pagination and search filter.
      security:
        - BearerAuth: []
        - ServiceAccountAuth: []
      parameters:
        - name: cursor
          in: query
          description: Base64 cursor for pagination
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AiRequestStatus'
        - name: search
          in: query
          description: Search term across ID, model, prompt summary, or result
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of AI requests.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAiRequests'
            application/xml:
              schema:
                type: string
        '304':
          description: Not Modified (cached representation matches ETag).
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/ai-requests/{id}:
    get:
      tags:
        - AI Requests
      summary: Get AI Request Details
      description: Retrieves complete details of an AI request by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: AI Request details.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestDetail'
        '304':
          description: Not Modified.
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ai-requests/{id}/trace:
    get:
      tags:
        - Request Trace Explorer
      summary: Get Request Execution Trace
      description: Synthesizes multi-stage distributed trace and timeline across all 6 microservices.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed execution trace and service pipeline stages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedTrace'
        '404':
          $ref: '#/components/responses/NotFound'

  /graphql:
    post:
      tags:
        - GraphQL
      summary: GraphQL Query and Mutation Endpoint
      description: Query AI requests, traces, models, and current user profile with query depth limiting.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "{ me { id email role } models { id name } }"
                variables:
                  type: object
      responses:
        '200':
          description: GraphQL execution result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================================================================
  # IDENTITY SERVICE ENDPOINTS (Port 3000)
  # =========================================================================
  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates user credentials using Argon2id and returns access + refresh JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/legacy-employees/{employeeId}:
    get:
      tags:
        - SOAP & Legacy Integration
      summary: Query Legacy Employee via SOAP
      description: >
        Invokes legacy SOAP 1.1 WSDL service (CheckLegacyEmployee) wrapped in
        circuit breaker, timeout, and exponential backoff retry. Supports JSON and XML.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            example: E1001
        - name: Accept
          in: header
          schema:
            type: string
            example: application/json
      responses:
        '200':
          description: Employee verification record from SOAP directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId:
                    type: string
                  exists:
                    type: boolean
                  fullName:
                    type: string
                  department:
                    type: string
                  status:
                    type: string
            application/xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceAccountAuth:
      type: apiKey
      in: header
      name: X-API-Key
    InternalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  responses:
    BadRequest:
      description: Bad request or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: Requested representation in Accept header is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate idempotency key reused with different payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Downstream dependency unreachable or circuit breaker OPEN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AiRequestStatus:
      type: string
      enum: [ACCEPTED, PROCESSING, WAITING_FOR_APPROVAL, COMPLETED, BLOCKED, FAILED]

    SubmitAiRequestPayload:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        modelPreference:
          type: object
          properties:
            model:
              type: string
            provider:
              type: string

    AiRequestSubmissionResponse:
      type: object
      properties:
        requestId:
          type: string
        status:
          $ref: '#/components/schemas/AiRequestStatus'
        traceId:
          type: string
        statusUrl:
          type: string

    AiRequestDetail:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AiRequestStatus'
        modelSelected:
          type: string
        sanitizedResult:
          type: string
        sanitizedPromptSummary:
          type: string
        traceId:
          type: string
        privacyAction:
          type: string
        policyDecision:
          type: string
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    PaginatedAiRequests:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AiRequestDetail'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            nextCursor:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
            hasMore:
              type: boolean

    EnrichedTrace:
      type: object
      properties:
        requestId:
          type: string
        traceId:
          type: string
        status:
          type: string
        pipelineStages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              service:
                type: string
              servicePort:
                type: integer
              status:
                type: string
              durationMs:
                type: integer
        timeline:
          type: array
          items:
            type: object
            properties:
              stepNumber:
                type: integer
              name:
                type: string
              service:
                type: string
              eventType:
                type: string
              status:
                type: string
              timestamp:
                type: string
              durationMs:
                type: integer

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: The requested resource was not found.
            details:
              type: array
              items:
                type: string
            correlationId:
              type: string
            requestId:
              type: string

