openapi: 3.1.0
info:
  title: AegisAI Security & Audit Service API
  description: >
    Enterprise AI Security & Audit Microservice providing immutable, tamper-resistant-by-design
    audit logging, cryptographic integrity digests, request lifecycle tracing, and multi-tenant compliance queries.
  version: 1.0.0
servers:
  - url: http://localhost:3005
    description: Local Development Server

paths:
  /v1/events:
    post:
      summary: Ingest and Persist Audit Event
      description: >
        Accepts security and audit events from AI Gateway and internal microservices,
        sanitizes sensitive data, generates a cryptographic SHA-256 integrity digest,
        and persists append-only records to MongoDB.
      security:
        - BearerAuth: []
        - InternalServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventInput'
      responses:
        '201':
          description: Event accepted and persisted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestEventResponse'
        '200':
          description: Event is a duplicate and was cleanly deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestEventResponse'
        '400':
          description: Bad request - schema validation failure or forbidden field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden - cross-tenant submission or insufficient permissions
    get:
      summary: Search Audit Events
      description: Searches audit events with tenant-scoped filters and pagination.
      security:
        - BearerAuth: []
        - InternalServiceKey: []
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [INFO, WARN, CRITICAL]
        - name: requestId
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Filtered audit events list with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventSearchResult'

  /v1/traces/{traceId}:
    get:
      summary: Get Request Trace Events
      description: Retrieves complete request lifecycle events for AI Gateway.
      security:
        - BearerAuth: []
        - InternalServiceKey: []
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Trace events found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '404':
          description: Trace not found

  /v1/events/{eventId}:
    get:
      summary: Get Single Audit Event
      description: Retrieves a single audit event by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event found
        '404':
          description: Event not found

  /v1/events/{eventId}/verify:
    get:
      summary: Cryptographically Verify Event Integrity
      description: Computes SHA-256 canonical digest and compares against stored digest to detect tampering.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification report

  /health/live:
    get:
      summary: Liveness Probe
      responses:
        '200':
          description: Service process is active

  /health/ready:
    get:
      summary: Readiness Probe
      responses:
        '200':
          description: MongoDB and dependencies readiness status

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  schemas:
    AuditEventInput:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          example: AI_REQUEST_ACCEPTED
        eventVersion:
          type: integer
          default: 1
        organizationId:
          type: string
          example: org_enterprise_alpha
        sourceService:
          type: string
          example: ai-gateway
        requestId:
          type: string
          example: req_12345
        traceId:
          type: string
          example: trace_67890
        callerId:
          type: string
          example: user_dev_1
        severity:
          type: string
          enum: [INFO, WARN, CRITICAL]
          default: INFO
        details:
          type: object
        correlationId:
          type: string

    IngestEventResponse:
      type: object
      properties:
        accepted:
          type: boolean
          example: true
        eventId:
          type: string
          example: evt_abc123
        status:
          type: string
          enum: [PERSISTED, DUPLICATE]
          example: PERSISTED

    TraceResponse:
      type: object
      properties:
        traceId:
          type: string
        requestId:
          type: string
        events:
          type: array
          items:
            type: object

    AuditEventSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            correlationId:
              type: string
